<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Tuner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent2: #7ec8a9;
    --red: #c86e6e;
    --text: #e8e0d0;
    --muted: #6b6560;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(200,169,110,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(126,200,169,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 560px;
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 400; color: var(--text); line-height: 1;
    flex: 1;
  }
  h1 em { font-style: italic; color: var(--accent); }

  #reload-btn {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); font-size: 16px; width: 36px; height: 36px;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #reload-btn:hover { color: var(--accent); border-color: var(--accent); }

  .main {
    width: 100%; max-width: 560px;
    display: flex; flex-direction: column; gap: 14px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; border-bottom: 1px solid var(--border);
  }

  .row-label {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); flex-shrink: 0; width: 48px;
  }

  .tuning-name { font-size: 11px; color: var(--text); letter-spacing: 0.05em; }

  /* ── PITCH ROW ── */
  .pitch-row { flex-direction: column; align-items: stretch; gap: 9px; padding: 11px 16px; }
  .pitch-top { display: flex; align-items: center; gap: 8px; }

  .pitch-field {
    display: flex; align-items: baseline; gap: 4px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 1px; padding: 6px 10px;
    transition: border-color 0.15s; flex-shrink: 0;
  }
  .pitch-field:focus-within { border-color: var(--accent); }
  .pitch-field.shifted { border-color: rgba(126,200,169,0.45); }

  input.hz-input {
    background: none; border: none; outline: none;
    color: var(--accent); font-family: 'DM Mono', monospace;
    font-size: 15px; width: 48px; -moz-appearance: textfield;
  }
  input.hz-input::-webkit-inner-spin-button,
  input.hz-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  input.hz-input.shifted { color: var(--accent2); }
  .hz-unit { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  .pitch-presets { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .pp-btn {
    padding: 4px 9px; background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px;
    cursor: pointer; border-radius: 1px; transition: all 0.15s;
  }
  .pp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pp-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,0.08); }

  .pitch-slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-bound { font-size: 9px; color: var(--muted); flex-shrink: 0; width: 26px; }
  .slider-bound.right { text-align: right; }

  input[type=range].pitch-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 2px; border-radius: 1px; outline: none; cursor: pointer;
  }
  input[type=range].pitch-slider::-webkit-slider-runnable-track { height: 2px; border-radius: 1px; }
  input[type=range].pitch-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; margin-top: -8px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent); cursor: grab; transition: background 0.15s;
  }
  input[type=range].pitch-slider.shifted::-webkit-slider-thumb {
    background: var(--accent2); box-shadow: 0 0 0 1px var(--accent2);
  }
  input[type=range].pitch-slider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ── OCTAVE ROW ── */
  .oct-ctrl {
    display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 1px; overflow: hidden;
  }
  .oct-step {
    width: 34px; height: 30px; background: none; border: none;
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 16px;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .oct-step:hover { background: var(--surface2); color: var(--accent); }
  .oct-readout {
    padding: 0 14px; height: 30px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    min-width: 76px;
  }
  .oct-val { font-size: 11px; letter-spacing: 0.05em; line-height: 1; color: var(--accent); }
  .oct-val.down { color: var(--accent2); }
  .oct-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; margin-top: 2px; }

  /* ── STRING GRID ── */
  .strings-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    border-top: 1px solid var(--border);
  }

  .string-col {
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition: background 0.15s;
    cursor: pointer;
  }
  .string-col:last-child { border-right: none; }
  .string-col:hover { background: var(--surface2); }

  /* Playing state */
  .string-col.playing { background: rgba(200,169,110,0.07); }
  .string-col.playing .note-name { color: var(--accent); }
  .string-col.playing .note-freq { color: rgba(200,169,110,0.5); }
  .string-col.playing::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(200,169,110,0.2);
    animation: glow 1.6s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{opacity:.2} 50%{opacity:1} }

  /* Detected states (listen) */
  .string-col.detected-in-tune { background: rgba(126,200,169,0.1); }
  .string-col.detected-in-tune .note-name { color: var(--accent2); }
  .string-col.detected-flat,
  .string-col.detected-sharp { background: rgba(200,110,110,0.07); }
  .string-col.detected-flat .note-name,
  .string-col.detected-sharp .note-name { color: var(--red); }

  .string-inner {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 18px 6px 14px; gap: 5px; flex: 1;
  }

  .string-num { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; }
  .note-name {
    font-family: 'Instrument Serif', serif;
    font-size: 1.6rem; color: var(--text); line-height: 1; transition: color 0.2s;
  }
  .note-freq { font-size: 9px; color: var(--muted); transition: color 0.2s; }

  .wave-wrap { width: 32px; height: 10px; }
  .wave-canvas { width: 32px; height: 10px; opacity: 0; transition: opacity 0.25s; display: block; }
  .string-col.playing .wave-canvas { opacity: 1; }

  /* Per-column tuning bar */
  .col-tuning-bar {
    height: 4px; background: var(--surface2); position: relative;
  }
  .col-cursor {
    position: absolute; top: 0; bottom: 0; width: 3px;
    background: var(--border); left: 50%;
    transform: translateX(-50%);
    transition: left 0.08s ease-out, background 0.12s;
    border-radius: 1px;
  }
  .col-center {
    position: absolute; top: 0; bottom: 0;
    left: calc(50% - 1px); width: 2px;
    background: var(--border); opacity: 0.5;
  }
  .string-col.detected-in-tune .col-cursor { background: var(--accent2); }
  .string-col.detected-flat .col-cursor,
  .string-col.detected-sharp .col-cursor { background: var(--red); }

  /* ── NEEDLE BAR ── */
  .needle-bar-wrap {
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #needle-canvas {
    display: block;
    width: 100%;
  }

  /* ── PRESETS ── */
  .preset-tabs {
    display: flex; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  .preset-tab {
    padding: 10px 14px; background: none; border: none;
    border-right: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.08em; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .preset-tab:hover { color: var(--text); background: var(--surface2); }
  .preset-tab.active { color: var(--accent); background: rgba(200,169,110,0.05); }
  .preset-tab .dot {
    display: inline-block; width: 4px; height: 4px;
    border-radius: 50%; background: var(--accent2); margin-left: 5px; vertical-align: middle;
  }
  .add-tab-btn {
    padding: 10px 14px; background: none; border: none;
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 15px; cursor: pointer; transition: color 0.15s; flex-shrink: 0;
  }
  .add-tab-btn:hover { color: var(--accent2); }

  .preset-editor { padding: 14px 16px 16px; }
  .pname-row { display: flex; gap: 8px; margin-bottom: 12px; }

  .pname-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 7px 10px; border-radius: 1px; outline: none; transition: border-color 0.15s;
  }
  .pname-input:focus { border-color: var(--accent); }

  .del-btn {
    padding: 7px 10px; background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px;
    cursor: pointer; border-radius: 1px; transition: all 0.15s; white-space: nowrap;
  }
  .del-btn:hover { border-color: var(--red); color: var(--red); }

  .tuning-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; }
  .t-cell { display: flex; flex-direction: column; gap: 4px; }
  .t-cell label { font-size: 9px; color: var(--muted); text-align: center; letter-spacing: 0.1em; }

  .note-sel, .oct-sel {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 5px 4px; text-align: center; border-radius: 1px;
    cursor: pointer; outline: none; appearance: none; transition: border-color 0.15s;
  }
  .note-sel:focus, .oct-sel:focus { border-color: var(--accent); }
  .oct-sel { color: var(--accent2); font-size: 10px; padding: 3px; }

  .p-actions { margin-top: 12px; display: flex; gap: 8px; }

  .use-btn {
    flex: 1; padding: 9px; background: none;
    border: 1px solid var(--accent2); color: var(--accent2);
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border-radius: 1px; transition: all 0.15s;
  }
  .use-btn:hover { background: rgba(126,200,169,0.08); }

  .save-btn {
    flex: 1; padding: 9px; background: var(--accent); border: none;
    color: var(--bg); font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border-radius: 1px; transition: opacity 0.15s;
  }
  .save-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <h1>Guitar <em>Tuner</em></h1>
  <button id="reload-btn" title="Reload" onclick="location.reload()">↺</button>
</header>

<div class="main">
  <div class="card">

    <div class="row">
      <span class="row-label">Tuning</span>
      <span class="tuning-name" id="tuning-name">Standard E</span>
    </div>

    <div class="row pitch-row">
      <div class="pitch-top">
        <span class="row-label">A4 ref</span>
        <div class="pitch-field" id="pitch-field">
          <input class="hz-input" id="hz-input" type="number" min="400" max="480" step="0.1" value="440">
          <span class="hz-unit">Hz</span>
        </div>
        <div class="pitch-presets" id="pitch-presets">
          <button class="pp-btn" data-hz="432">432</button>
          <button class="pp-btn active" data-hz="440">440</button>
          <button class="pp-btn" data-hz="442">442</button>
          <button class="pp-btn" data-hz="443">443</button>
        </div>
      </div>
      <div class="pitch-slider-wrap">
        <span class="slider-bound">400</span>
        <input type="range" class="pitch-slider" id="pitch-slider" min="400" max="480" step="0.1" value="440">
        <span class="slider-bound right">480</span>
      </div>
    </div>

    <div class="row">
      <span class="row-label">Octave</span>
      <div class="oct-ctrl">
        <button class="oct-step" id="oct-down">−</button>
        <div class="oct-readout">
          <span class="oct-val" id="oct-val">standard</span>
          <span class="oct-sub" id="oct-sub">×1</span>
        </div>
        <button class="oct-step" id="oct-up">+</button>
      </div>
    </div>

    <div class="strings-grid" id="strings-grid"></div>

    <div class="needle-bar-wrap">
      <canvas id="needle-canvas" height="40"></canvas>
    </div>

  </div>

  <div class="card">
    <div class="preset-tabs" id="preset-tabs"></div>
    <div id="preset-content"></div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────
const NOTE_NAMES      = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FADE_IN         = 0.025;
const FADE_OUT        = 0.09;
const DEFAULT_A4      = 440;
const SLIDER_MIN      = 400;
const SLIDER_MAX      = 480;
const CENTS_ENTER     = 3;   // enter green zone
const CENTS_EXIT      = 6;   // leave green zone (hysteresis)
const CENTS_RANGE     = 100;

const DEFAULT_PRESETS = [
  { id:'std',   name:'Standard E', builtin:true,
    strings:[{note:'E',oct:2},{note:'A',oct:2},{note:'D',oct:3},{note:'G',oct:3},{note:'B',oct:3},{note:'E',oct:4}] },
  { id:'dropd', name:'Drop D', builtin:true,
    strings:[{note:'D',oct:2},{note:'A',oct:2},{note:'D',oct:3},{note:'G',oct:3},{note:'B',oct:3},{note:'E',oct:4}] },
  { id:'opend', name:'Open D', builtin:true,
    strings:[{note:'D',oct:2},{note:'A',oct:2},{note:'D',oct:3},{note:'F#',oct:3},{note:'A',oct:3},{note:'D',oct:4}] },
  { id:'openg', name:'Open G', builtin:true,
    strings:[{note:'D',oct:2},{note:'G',oct:2},{note:'D',oct:3},{note:'G',oct:3},{note:'B',oct:3},{note:'D',oct:4}] },
];

// ── State ────────────────────────────────────────────────────────
let presets           = JSON.parse(localStorage.getItem('gt_presets') || 'null') || DEFAULT_PRESETS;
let activeTuning      = presets[0].strings.map(s => ({...s}));
let activeTuningName  = presets[0].name;
let selectedPresetIdx = 0;
let editingPreset     = null;
let a4                = DEFAULT_A4;
let octaveOffset      = 0;
let octMult           = 1;
let audioCtx          = null;
let playingIdx        = null;
let playingNode       = null;
let waveAnimId        = null;

// Mic / listen state
let micStream         = null;
let analyser          = null;
let listenAnimId      = null;
let listenBuf         = null;
let smoothedFreq      = null;
let stableCount       = 0;
let lastRawFreq       = null;
let isInTune          = false; // hysteresis state

// Needle
let needlePos         = 0;
let needleTarget      = 0;
let needleActive      = false;
let needleAnimId      = null;

// ── Helpers ──────────────────────────────────────────────────────
function noteFreq(name, octave, refA4, mult) {
  const idx = NOTE_NAMES.indexOf(name);
  return refA4 * Math.pow(2, ((octave - 4) * 12 + idx - 9) / 12) * mult;
}
function freqToCents(det, tgt) { return 1200 * Math.log2(det / tgt); }

function findClosestString(freq) {
  let best = null, bestScore = Infinity;
  activeTuning.forEach((s, i) => {
    for (let sh = -1; sh <= 1; sh++) {
      const target = noteFreq(s.note, s.oct + sh, a4, 1);
      const cents  = freqToCents(freq, target);
      // Penalise octave-shifted matches so we prefer the actual string octave
      const score  = Math.abs(cents) + (sh !== 0 ? 50 : 0);
      if (score < bestScore) { bestScore = score; best = { idx:i, string:s, target, cents }; }
    }
  });
  return best;
}

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ── Play ─────────────────────────────────────────────────────────
function perceivedGain(freq) {
  const f = Math.max(20, freq);
  if (f < 200)  return Math.min(0.9, 0.3 + 0.6 * Math.log10(f/20) / Math.log10(10));
  if (f < 1000) return 0.5 + 0.1 * (f-200) / 800;
  if (f < 4000) return 0.58 - 0.08 * (f-1000) / 3000;
  return Math.max(0.35, 0.5 - 0.15 * (f-4000) / 6000);
}

function playString(idx) {
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  stopCurrent();
  const s = activeTuning[idx];
  const freq = noteFreq(s.note, s.oct, a4, octMult);
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(perceivedGain(freq), ctx.currentTime + FADE_IN);
  osc.connect(gain); gain.connect(ctx.destination); osc.start();
  playingIdx = idx; playingNode = { osc, gain };
  document.querySelector(`.string-col[data-idx="${idx}"]`)?.classList.add('playing');
  startWave(idx);
}

function stopCurrent() {
  if (!playingNode) return;
  const ctx = getCtx();
  const { osc, gain } = playingNode;
  gain.gain.cancelScheduledValues(ctx.currentTime);
  gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0, ctx.currentTime + FADE_OUT);
  osc.stop(ctx.currentTime + FADE_OUT + 0.01);
  document.querySelector(`.string-col[data-idx="${playingIdx}"]`)?.classList.remove('playing');
  cancelAnimationFrame(waveAnimId);
  waveAnimId = null; playingIdx = null; playingNode = null;
}

function updateLiveFreq() {
  if (!playingNode || playingIdx === null) return;
  const s = activeTuning[playingIdx];
  playingNode.osc.frequency.setTargetAtTime(noteFreq(s.note, s.oct, a4, octMult), getCtx().currentTime, 0.01);
}

function startWave(idx) {
  const canvas = document.querySelector(`.string-col[data-idx="${idx}"] .wave-canvas`);
  if (!canvas) return;
  const c = canvas.getContext('2d'); let t = 0;
  function draw() {
    c.clearRect(0,0,32,10); c.beginPath(); c.strokeStyle='#c8a96e'; c.lineWidth=1.5;
    for (let x=0;x<=32;x++){const y=5+Math.sin((x/32)*Math.PI*2+t)*3.5;x===0?c.moveTo(x,y):c.lineTo(x,y);}
    c.stroke(); t+=0.18; waveAnimId=requestAnimationFrame(draw);
  }
  draw();
}

// ── String tap logic (unified play/listen) ───────────────────────
function onStringTap(idx) {
  if (playingIdx === idx) {
    // currently playing this string — stop and return to listen
    stopCurrent();
    resetListenDisplay();
    needleTarget = 0; needleActive = false;
  } else {
    // stop anything playing, play this string
    stopCurrent();
    resetListenDisplay();
    needleTarget = 0; needleActive = false;
    playString(idx);
  }
}

// ── Mic / pitch detection ────────────────────────────────────────
async function startMic() {
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const source = ctx.createMediaStreamSource(micStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0.0;
    listenBuf = new Float32Array(analyser.fftSize);
    source.connect(analyser);
    runPitchDetection();
  } catch(e) {
    console.warn('Mic access denied:', e);
  }
}

function detectPitch(buf, sampleRate) {
  const n = buf.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i]*buf[i];
  if (Math.sqrt(rms/n) < 0.004) return null;

  const half = Math.floor(n / 2);
  const nsdf = new Float32Array(half);
  let r0 = 0;
  for (let i = 0; i < n; i++) r0 += buf[i]*buf[i];

  for (let lag = 0; lag < half; lag++) {
    let s = 0;
    for (let i = 0; i < half; i++) s += buf[i] * buf[i + lag];
    nsdf[lag] = r0 > 0 ? s / r0 : 0;
  }

  let d = 1; while (d < half && nsdf[d] > 0) d++;
  let maxVal = -1, maxIdx = -1;
  for (let i = d; i < half - 1; i++) {
    if (nsdf[i] > nsdf[i-1] && nsdf[i] > nsdf[i+1] && nsdf[i] > maxVal) {
      maxVal = nsdf[i]; maxIdx = i;
    }
  }
  if (maxIdx === -1 || maxVal < 0.3) return null;

  // Parabolic interpolation
  let refined = maxIdx;
  if (maxIdx > 0 && maxIdx < half - 1) {
    const p = nsdf[maxIdx-1], nx = nsdf[maxIdx+1];
    const dn = 2*(2*maxVal - p - nx);
    if (Math.abs(dn) > 1e-8) refined = maxIdx + (nx - p) / dn;
  }

  let freq = sampleRate / refined;

  // Octave correction — prefer higher octave when sub-harmonic peak is strong
  const lagHalf = Math.round(refined / 2);
  if (lagHalf >= 2 && lagHalf < half && nsdf[lagHalf] > 0.45) {
    let rH = lagHalf;
    if (lagHalf > 0 && lagHalf < half - 1) {
      const p = nsdf[lagHalf-1], nx = nsdf[lagHalf+1];
      const dn = 2*(2*nsdf[lagHalf] - p - nx);
      if (Math.abs(dn) > 1e-8) rH = lagHalf + (nx - p) / dn;
    }
    freq = sampleRate / rH;
  }

  return (freq < 70 || freq > 1400) ? null : freq;
}

const STABLE_FRAMES = 3;

function runPitchDetection() {
  function tick() {
    listenAnimId = requestAnimationFrame(tick);
    // Don't process while a reference tone is playing
    if (playingNode || !analyser) return;

    analyser.getFloatTimeDomainData(listenBuf);
    const freq = detectPitch(listenBuf, getCtx().sampleRate);

    if (freq === null) {
      stableCount = 0; lastRawFreq = null;
      if (smoothedFreq !== null) { smoothedFreq = null; resetListenDisplay(); needleActive = false; needleTarget = 0; }
      return;
    }

    if (lastRawFreq !== null && Math.abs(freq - lastRawFreq) / lastRawFreq > 0.10) {
      stableCount = 1; lastRawFreq = freq; return;
    }
    lastRawFreq = freq;
    stableCount = Math.min(stableCount + 1, STABLE_FRAMES);
    if (stableCount < STABLE_FRAMES) return;

    smoothedFreq = smoothedFreq === null ? freq : smoothedFreq * 0.6 + freq * 0.4;
    updateListenDisplay(smoothedFreq);
  }
  tick();
}

// ── Listen display ───────────────────────────────────────────────
function resetListenDisplay() {
  document.querySelectorAll('.string-col').forEach(col => {
    col.classList.remove('detected-in-tune','detected-flat','detected-sharp');
    const cur = col.querySelector('.col-cursor');
    if (cur) cur.style.left = '50%';
  });
  isInTune = false;
}

function updateListenDisplay(freq) {
  const match = findClosestString(freq);
  if (!match) return;
  const cents = match.cents, absCents = Math.abs(cents);

  // Hysteresis: enter green at ±3¢, exit only past ±6¢
  if (!isInTune && absCents <= CENTS_ENTER) isInTune = true;
  if (isInTune && absCents > CENTS_EXIT)   isInTune = false;

  const state = isInTune ? 'detected-in-tune' : cents < 0 ? 'detected-flat' : 'detected-sharp';
  const clamped = Math.max(-CENTS_RANGE, Math.min(CENTS_RANGE, cents));
  const pct = 50 + (clamped / CENTS_RANGE) * 50;

  document.querySelectorAll('.string-col').forEach((col, i) => {
    const isMatch = i === match.idx;
    col.classList.remove('detected-in-tune','detected-flat','detected-sharp');
    if (isMatch) col.classList.add(state);
    const cur = col.querySelector('.col-cursor');
    if (cur) cur.style.left = isMatch ? pct+'%' : '50%';
  });

  needleTarget = Math.max(-1, Math.min(1, cents / CENTS_RANGE));
  needleActive = true;
}

// ── Needle canvas ────────────────────────────────────────────────
function startNeedleLoop() {
  if (needleAnimId) return;
  function loop() {
    needleAnimId = requestAnimationFrame(loop);
    needlePos += (needleTarget - needlePos) * 0.10;
    drawNeedle(needlePos, needleActive);
  }
  loop();
}

function drawNeedle(pos, active) {
  const canvas = document.getElementById('needle-canvas');
  if (!canvas) return;
  const W = canvas.offsetWidth;
  if (!W) return;
  if (canvas.width !== W) canvas.width = W;
  const H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const barH = 3;
  const barY = H / 2 - barH / 2;
  const pad  = 24;
  const barW = W - pad * 2;

  // Track background
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.roundRect(pad, barY, barW, barH, 2);
  ctx.fill();

  if (!active) {
    // idle: just center tick
    ctx.fillStyle = '#333';
    ctx.fillRect(cx - 1, barY - 4, 2, barH + 8);
    return;
  }

  const needleX  = cx + pos * (barW / 2);
  const absFrac  = Math.abs(pos);

  // Color: sharply green near center, fast ramp to red
  // Use a squared curve so it goes red quickly outside the in-tune zone
  const inTuneFrac = CENTS_ENTER / CENTS_RANGE; // ~0.03
  const t = Math.min(1, (absFrac - inTuneFrac) / (0.15 - inTuneFrac));
  const hue  = isInTune ? 142 : Math.max(0, 142 - t * 142);
  const sat  = 50 + (1 - absFrac) * 15;
  const lit  = 44 + (1 - absFrac) * 8;
  const col  = `hsl(${hue},${sat}%,${lit}%)`;

  // Fill from center to needle
  const fillL = Math.min(cx, needleX);
  const fillR = Math.max(cx, needleX);
  if (fillR - fillL > 0.5) {
    const grad = ctx.createLinearGradient(fillL, 0, fillR, 0);
    if (pos < 0) { grad.addColorStop(0, col); grad.addColorStop(1, '#222'); }
    else         { grad.addColorStop(0, '#222'); grad.addColorStop(1, col); }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(fillL, barY, fillR - fillL, barH, 1);
    ctx.fill();
  }

  // Center tick
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(cx - 1, barY - 5, 2, barH + 10);

  // Needle dot
  const nR = 8;
  ctx.beginPath();
  ctx.arc(needleX, H / 2, nR, 0, Math.PI * 2);
  if (isInTune) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
  ctx.fillStyle = col;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ── Concert pitch ────────────────────────────────────────────────
const hzInput    = document.getElementById('hz-input');
const pitchField = document.getElementById('pitch-field');
const slider     = document.getElementById('pitch-slider');

function setA4(val, source) {
  val = Math.round(Math.max(SLIDER_MIN, Math.min(SLIDER_MAX, val)) * 10) / 10;
  a4 = val;
  if (source !== 'input')  hzInput.value = val.toFixed(1);
  if (source !== 'slider') slider.value = val;
  const shifted = Math.abs(val - DEFAULT_A4) > 0.05;
  hzInput.classList.toggle('shifted', shifted);
  pitchField.classList.toggle('shifted', shifted);
  slider.classList.toggle('shifted', shifted);
  const pct = ((val - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN)) * 100;
  slider.style.background = `linear-gradient(to right,${shifted?'var(--accent2)':'var(--accent)'} ${pct}%,var(--border) ${pct}%)`;
  document.querySelectorAll('.pp-btn').forEach(b => b.classList.toggle('active', Math.abs(parseFloat(b.dataset.hz)-val)<0.05));
  updateLiveFreq(); refreshFreqLabels();
}

hzInput.addEventListener('change', () => { const v=parseFloat(hzInput.value); if(!isNaN(v)) setA4(v,'input'); });
hzInput.addEventListener('keydown', e => {
  if (e.key==='Enter') hzInput.blur();
  if (e.key==='ArrowUp')   { e.preventDefault(); setA4(a4+0.1,'input'); hzInput.value=a4.toFixed(1); }
  if (e.key==='ArrowDown') { e.preventDefault(); setA4(a4-0.1,'input'); hzInput.value=a4.toFixed(1); }
});
slider.addEventListener('input', () => setA4(parseFloat(slider.value),'slider'));
document.getElementById('pitch-presets').addEventListener('click', e => {
  const b=e.target.closest('.pp-btn'); if(b) setA4(parseFloat(b.dataset.hz),'preset');
});

// ── Octave ───────────────────────────────────────────────────────
function setOctave(steps) {
  octaveOffset = Math.max(-3, Math.min(4, steps));
  octMult = Math.pow(2, octaveOffset);
  const ve=document.getElementById('oct-val'), se=document.getElementById('oct-sub');
  if (octaveOffset===0) { ve.textContent='standard'; ve.className='oct-val'; }
  else { ve.textContent=(octaveOffset>0?'+':'')+octaveOffset+' oct'; ve.className='oct-val'+(octaveOffset<0?' down':''); }
  se.textContent = octMult<1 ? '÷'+Math.round(1/octMult) : '×'+octMult;
  updateLiveFreq(); refreshFreqLabels();
}
document.getElementById('oct-up').addEventListener('click',   () => setOctave(octaveOffset+1));
document.getElementById('oct-down').addEventListener('click', () => setOctave(octaveOffset-1));

// ── Strings ──────────────────────────────────────────────────────
function refreshFreqLabels() {
  document.querySelectorAll('.string-col').forEach(col => {
    const i=Number(col.dataset.idx), s=activeTuning[i];
    col.querySelector('.note-freq').textContent = noteFreq(s.note,s.oct,a4,octMult).toFixed(1)+' Hz';
  });
}

function renderStrings() {
  document.getElementById('tuning-name').textContent = activeTuningName;
  const grid = document.getElementById('strings-grid');
  grid.innerHTML = '';
  activeTuning.forEach((s, i) => {
    const freq = noteFreq(s.note, s.oct, a4, octMult);
    const col  = document.createElement('div');
    col.className = 'string-col';
    col.dataset.idx = i;
    col.innerHTML = `
      <div class="string-inner">
        <span class="string-num">${i+1}</span>
        <span class="note-name">${s.note}</span>
        <span class="note-freq">${freq.toFixed(1)} Hz</span>
        <div class="wave-wrap"><canvas class="wave-canvas" width="32" height="10"></canvas></div>
      </div>
      <div class="col-tuning-bar">
        <div class="col-center"></div>
        <div class="col-cursor"></div>
      </div>`;
    col.addEventListener('click', () => onStringTap(i));
    grid.appendChild(col);
  });
}

// ── Presets ──────────────────────────────────────────────────────
function savePresets() { localStorage.setItem('gt_presets', JSON.stringify(presets)); }
function selectPreset(idx) { selectedPresetIdx=idx; editingPreset=JSON.parse(JSON.stringify(presets[idx])); renderPresets(); }

function renderPresets() {
  const tabsEl=document.getElementById('preset-tabs'), contentEl=document.getElementById('preset-content');
  tabsEl.innerHTML='';
  presets.forEach((p,i)=>{
    const tab=document.createElement('button');
    tab.className='preset-tab'+(i===selectedPresetIdx?' active':'');
    tab.innerHTML=p.name+(p.builtin?'':'<span class="dot"></span>');
    tab.addEventListener('click',()=>selectPreset(i)); tabsEl.appendChild(tab);
  });
  const addBtn=document.createElement('button');
  addBtn.className='add-tab-btn'; addBtn.textContent='+'; addBtn.title='New preset';
  addBtn.addEventListener('click',addPreset); tabsEl.appendChild(addBtn);
  if(!editingPreset){contentEl.innerHTML='';return;}
  const ep=editingPreset; contentEl.innerHTML='';
  const editor=document.createElement('div'); editor.className='preset-editor';
  const nameRow=document.createElement('div'); nameRow.className='pname-row';
  const nameInput=document.createElement('input');
  nameInput.className='pname-input'; nameInput.value=ep.name; nameInput.placeholder='Preset name…';
  nameInput.addEventListener('input',()=>{ep.name=nameInput.value;}); nameRow.appendChild(nameInput);
  if(!ep.builtin){
    const delBtn=document.createElement('button'); delBtn.className='del-btn'; delBtn.textContent='Delete';
    delBtn.addEventListener('click',()=>{
      if(confirm(`Delete "${ep.name}"?`)){
        presets.splice(selectedPresetIdx,1); selectedPresetIdx=Math.max(0,selectedPresetIdx-1);
        editingPreset=presets.length?JSON.parse(JSON.stringify(presets[selectedPresetIdx])):null;
        savePresets(); renderPresets();
      }
    }); nameRow.appendChild(delBtn);
  }
  editor.appendChild(nameRow);
  const grid=document.createElement('div'); grid.className='tuning-grid';
  ep.strings.forEach((s,i)=>{
    const cell=document.createElement('div'); cell.className='t-cell';
    const lbl=document.createElement('label'); lbl.textContent=`str ${i+1}`; cell.appendChild(lbl);
    const ns=document.createElement('select'); ns.className='note-sel';
    NOTE_NAMES.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;if(n===s.note)o.selected=true;ns.appendChild(o);});
    ns.addEventListener('change',()=>{ep.strings[i].note=ns.value;}); cell.appendChild(ns);
    const os=document.createElement('select'); os.className='oct-sel';
    for(let ov=1;ov<=6;ov++){const o=document.createElement('option');o.value=ov;o.textContent=ov;if(ov===s.oct)o.selected=true;os.appendChild(o);}
    os.addEventListener('change',()=>{ep.strings[i].oct=Number(os.value);}); cell.appendChild(os);
    grid.appendChild(cell);
  });
  editor.appendChild(grid);
  const actions=document.createElement('div'); actions.className='p-actions';
  const useBtn=document.createElement('button'); useBtn.className='use-btn'; useBtn.textContent='Use tuning';
  useBtn.addEventListener('click',()=>{stopCurrent();activeTuning=ep.strings.map(s=>({...s}));activeTuningName=ep.name;renderStrings();});
  actions.appendChild(useBtn);
  if(!ep.builtin){
    const saveBtn=document.createElement('button'); saveBtn.className='save-btn'; saveBtn.textContent='Save changes';
    saveBtn.addEventListener('click',()=>{presets[selectedPresetIdx]=JSON.parse(JSON.stringify(ep));savePresets();renderPresets();});
    actions.appendChild(saveBtn);
  }
  editor.appendChild(actions); contentEl.appendChild(editor);
}

function addPreset() {
  const p={id:'custom_'+Date.now(),name:'Custom '+(presets.filter(p=>!p.builtin).length+1),builtin:false,strings:JSON.parse(JSON.stringify(presets[0].strings))};
  presets.push(p); savePresets(); selectPreset(presets.length-1);
}

// ── Init ─────────────────────────────────────────────────────────
renderStrings();
selectPreset(0);
requestAnimationFrame(() => setA4(DEFAULT_A4, 'init'));
startNeedleLoop();
startMic();
</script>
